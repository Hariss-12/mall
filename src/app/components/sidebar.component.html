<aside class="sidebar-container">
  <div class="sidebar-scroll-wrapper">
    <!-- Menu Categories -->
    <nav class="sidebar-menu">
      <div *ngFor="let category of menuCategories" class="menu-category">
        <!-- Category Header -->
        <button
          (click)="toggleCategory(category.name)"
          class="category-header"
          [class.expanded]="isCategoryExpanded(category.name)">
          <span class="category-name">{{ category.name }}</span>
          <span class="category-toggle">{{ isCategoryExpanded(category.name) ? '▼' : '▶' }}</span>
        </button>

        <!-- Category Items -->
        <div
          class="category-items"
          [class.collapsed]="!isCategoryExpanded(category.name)">
          <button
            *ngFor="let item of category.items"
            (click)="selectMenu(item.id)"
            [class.active]="activeMenu() === item.id"
            class="sidebar-menu-item"
            [title]="item.description">
            <span class="menu-icon">{{ item.icon }}</span>
            <span class="menu-label">{{ item.label }}</span>

            <!-- Hover Tooltip -->
            <div class="sidebar-tooltip">
              <p class="sidebar-tooltip-title">{{ item.label }}</p>
              <p class="sidebar-tooltip-desc">{{ item.description }}</p>
            </div>

            <!-- Active indicator -->
            <div
              *ngIf="activeMenu() === item.id"
              class="sidebar-active-indicator">
            </div>
          </button>
        </div>
      </div>
    </nav>
  </div>
</aside>
